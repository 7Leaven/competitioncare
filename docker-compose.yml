version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: competitioncare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Magicfree
      POSTGRES_DB: competitioncare
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: competitioncare-redis
    ports:
      - "6379:6379"
volumes:
  postgres_data:
